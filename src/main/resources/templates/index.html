<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Price Comparison</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .search-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #343a40;
        }
        .zomato {
            color: #cb202d;
        }
        .vs {
            margin: 0 10px;
            color: #6c757d;
        }
        .swiggy {
            color: #fc8019;
        }
        .search-btn {
            background: linear-gradient(to right, #cb202d, #fc8019);
            border: none;
        }
        .search-btn:hover {
            background: linear-gradient(to right, #b01c27, #e67316);
        }
        .dish-btn {
            margin: 5px;
            background: #f8f9fa;
            color: #212529;
            border: 1px solid #dee2e6;
        }
        .dish-btn:hover {
            background: #e9ecef;
            border: 1px solid #ced4da;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="search-container">
            <div class="logo-container">
                <span class="logo zomato">Zomato</span>
                <span class="logo vs">vs</span>
                <span class="logo swiggy">Swiggy</span>
            </div>
            <h2 class="text-center mb-4">Food Price Comparison</h2>
            <p class="text-center text-muted mb-4">Find the best deals on your favorite food items</p>
            
            <form action="/compare" method="get">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" id="foodItem" name="item" placeholder="Search for food (e.g., pizza, burger)">
                    <button class="btn btn-primary search-btn" type="submit">Compare Prices</button>
                </div>
            </form>
            
            <div class="text-center mt-4">
                <p class="text-muted mb-2">Popular searches:</p>
                <div>
                    <a href="/compare?item=pizza" class="btn btn-sm dish-btn">Pizza</a>
                    <a href="/compare?item=burger" class="btn btn-sm dish-btn">Burger</a>
                    <a href="/compare?item=biryani" class="btn btn-sm dish-btn">Biryani</a>
                    <a href="/compare?item=dosa" class="btn btn-sm dish-btn">Dosa</a>
                    <a href="/compare?item=pasta" class="btn btn-sm dish-btn">Pasta</a>
                    <a href="/compare?item=noodles" class="btn btn-sm dish-btn">Noodles</a>
                    <a href="/compare?item=rolls" class="btn btn-sm dish-btn">Rolls</a>
                    <a href="/compare?item=paneer" class="btn btn-sm dish-btn">Paneer</a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
